server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Netlify redirect equivalents
    location = /crabs {
        return 301 https://www.youtube.com/v/8X88VLn42JQ;
    }

    location = /redcap {
        return 301 /contracts;
    }

    location ~* ^/docs/missingcodes/?$ {
        return 301 /missingcodes;
    }

    location ~* ^/docs/report-tweaks/?$ {
        return 301 /report-tweaks;
    }

    # Redirect trailing slashes for clean URLs (e.g. /contracts/ -> /contracts)
    rewrite ^/(.+)/$ /$1 permanent;

    # Clean URL handling (e.g. /contracts -> contracts.html)
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(jpg|jpeg|png|gif|ico|svg|css|js)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }
}
